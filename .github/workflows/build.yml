name: Build ReVanced APKs

on:
  workflow_dispatch:
    inputs:
      patches:
        description: "Patch source"
        required: true
        default: "base"
        type: choice
        options:
          - base
          - anddea
          - custom
      apps:
        description: "Apps to build (comma separated)"
        required: true
        default: "youtube,youtube-music"
        type: string
      custom_patches_repo:
        description: "Custom patches repo (only if patches=custom)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        env:
          PATCH_SOURCE: ${{ inputs.patches }}
          APPS: ${{ inputs.apps }}
          CUSTOM_PATCHES_REPO: ${{ inputs.custom_patches_repo }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (${{ inputs.patches }})"
          body: |
            **Patches:** ${{ inputs.patches }}
            **Apps:** ${{ inputs.apps }}
          files: build/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
